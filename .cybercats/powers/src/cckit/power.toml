name = "CCKit"
id = "cckit"
version = "1.0.0"
description = "Install Homebrew packages and organise them into portable CYBERCATS kits."

aliases = []

[entrypoint]
file = "cckit.sh"
function = "cybercats_cckit"

[[commands]]
name = "install <formula> [-k <kit>]"
description = "Install and track a Homebrew formula."

[[commands]]
name = "install --cask <cask> [-k <kit>]"
description = "Install and track a Homebrew cask."

[[commands]]
name = "kit <package> -k <kit>"
description = "Add an already installed package to one or more kits."

[[commands]]
name = "unkit <package> -k <kit>"
description = "Remove a package from a kit without uninstalling it."

[[commands]]
name = "uninstall <package>"
description = "Uninstall a package and remove it from all kits."

[[commands]]
name = "kits"
description = "List available CCKit kits."

[[commands]]
name = "show <kit>"
description = "Show the contents of a kit."

[[commands]]
name = "search <query>"
description = "Search Homebrew."

[[commands]]
name = "info <package>"
description = "Show Homebrew package information."

[[commands]]
name = "update"
description = "Update Homebrew."

[[commands]]
name = "upgrade [package]"
description = "Upgrade Homebrew packages."

[[commands]]
name = "list"
description = "List packages installed through Homebrew."