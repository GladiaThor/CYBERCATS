name = "CCKit"
id = "cckit"
version = "1.0.0"
description = "Install Homebrew software and organise it into portable CYBERCATS packs."

aliases = []

[entrypoint]
file = "cckit.sh"
function = "cybercats_cckit"

[[commands]]
name = "install <formula> [-p <pack>]"
description = "Install and track a Homebrew formula."

[[commands]]
name = "install --cask <cask> [-p <pack>]"
description = "Install and track a Homebrew cask."

[[commands]]
name = "pack <package> -p <pack>"
description = "Add an already installed package to one or more packs."

[[commands]]
name = "unpack <package> -p <pack>"
description = "Remove a package from a pack without uninstalling it."

[[commands]]
name = "uninstall <package>"
description = "Uninstall a package and remove it from all packs."

[[commands]]
name = "packs"
description = "List available CCKit packs."

[[commands]]
name = "show <pack>"
description = "Show the contents of a pack."

[[commands]]
name = "search <query>"
description = "Search Homebrew."

[[commands]]
name = "info <package>"
description = "Show Homebrew package information."

[[commands]]
name = "update"
description = "Update Homebrew."

[[commands]]
name = "upgrade [package]"
description = "Upgrade Homebrew packages."

[[commands]]
name = "list"
description = "List packages installed through Homebrew."